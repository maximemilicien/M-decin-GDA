<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDC — Accès Console</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

  /* THEME "Baie de triage" — clinique, apaisant, arrondi. Remplace l'ancien
     thème sombre tactique (bleu-nuit/or/monospace terminal anguleux). */
  :root {
    --bg-void: #071a1c;
    --bg-panel: #0d2528;
    --bg-panel-raised: #123134;
    --line: #1c3a3c;
    --line-bright: #2f5e5f;
    --red: #e11d48;
    --red-glow: #fb7185;
    --green: #10b981;
    --blue: #0ea5e9;
    --blue-glow: #5fd4fb;
    --text-primary: #eafaf6;
    --text-dim: #80aca9;
    --text-faint: #3f6b69;
    --amber: #f5a524;
    --amber-glow: #fcd34d;
    --radius-card: 18px;
    --shadow-panel: 0 18px 44px rgba(0, 0, 0, 0.45);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg-void);
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', sans-serif;
    overflow-x: hidden;
  }

  html { scroll-behavior: smooth; }

  /* Animations courtes : l'interface parait reactive sans alourdir la page. */
  .rapport-mdc-wrap { animation: apparitionDouce .18s ease-out both; }
  .rapport-mdc-card, .rapport-validation-item { transition: border-color .16s ease, background .16s ease, transform .16s ease; }
  .rapport-validation-item:hover { border-color: rgba(93, 201, 247, .45); background: rgba(13, 61, 90, .18); }
  .rapport-validation-btn { transition: transform .12s ease, filter .12s ease, background .12s ease; }
  .rapport-validation-btn:active { transform: scale(.97); }
  .rapport-validation-btn:disabled { opacity: .65; cursor: wait; }
  @keyframes apparitionDouce { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    body { background-attachment: scroll; }
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    position: relative;

    /* Fond clinique : dégradé radial + grille (plus d'image externe). */
    background-image:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(14, 165, 233, 0.16), transparent 60%),
      radial-gradient(ellipse 60% 50% at 85% 90%, rgba(16, 185, 129, 0.12), transparent 60%),
      linear-gradient(180deg, #071a1c 0%, #051314 100%);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  /* Ambient grid backdrop */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.15;
    mask-image: radial-gradient(ellipse 60% 50% at 50% 40%, black, transparent);
    pointer-events: none;
  }

  .side-img {
    position: fixed;
    top: 0;
    bottom: 0;
    width: 26vw;
    max-width: 420px;
    background-size: cover;
    background-position: center;
    z-index: 0;
    pointer-events: none;
  }
  .side-img.left {
    left: 0;
    background-image: url("image/agent-gda-1.png");
    mask-image: linear-gradient(90deg, black 40%, transparent 100%);
    -webkit-mask-image: linear-gradient(90deg, black 40%, transparent 100%);
  }
  .side-img.right {
    right: 0;
    background-image: url("image/agent-gda-2.png");
    mask-image: linear-gradient(270deg, black 40%, transparent 100%);
    -webkit-mask-image: linear-gradient(270deg, black 40%, transparent 100%);
  }

  .console {
    width: 100%;
    max-width: 460px;
    position: relative;
    z-index: 1;
    transition: max-width 0.4s ease;
  }
  .console.expanded {
    max-width: 1400px;
  }

  /* Header */
  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-bottom: 28px;
    text-align: center;
  }

  .crest {
    width: 180px;
    height: 180px;
    flex-shrink: 0;
    position: relative;
    perspective: 400px;
    margin-bottom: 14px;
  }
  .crest::before {
    content: '';
    position: absolute;
    inset: -30px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(224, 82, 79, 0.35) 0%, transparent 70%);
    filter: blur(6px);
    z-index: 0;
  }
  .coin {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    animation: spinY 6s linear infinite;
    z-index: 1;
  }
  .coin-layer {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
  }
  .coin-layer img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }
  .coin-front img {
    filter: drop-shadow(0 0 18px rgba(224, 82, 79, 0.5));
  }
  @keyframes spinY {
    from { transform: rotateY(0deg); }
    to { transform: rotateY(360deg); }
  }

  .header-text .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.01em;
    color: var(--red-glow);
    text-transform: none;
    font-weight: 700;
  }
  .header-text h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-top: 4px;
  }

  /* Panel */
  .panel {
    background: transparent;
    border: none;
    border-radius: 12px;
    overflow: hidden;
    backdrop-filter: none;
  }

  .panel-strip {
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
    opacity: 0.6;
  }

  .panel-body { padding: 32px 28px; }

  .field-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.01em;
    text-transform: none;
    color: var(--text-dim);
    display: block;
    margin-bottom: 10px;
  }

  .input-row {
    display: flex;
    gap: 10px;
  }

  .input-scan {
    position: relative;
    flex: 1;
  }

  #matricule, #discordIdVerif {
    width: 100%;
    background: var(--bg-void);
    border: 1px solid var(--line-bright);
    border-radius: 10px;
    padding: 14px 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.01em;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  #matricule::placeholder, #discordIdVerif::placeholder { color: var(--text-faint); letter-spacing: normal; font-weight: 400; }
  #matricule:focus, #discordIdVerif:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(194, 59, 59, 0.12);
  }

  .btn-verify {
    background: var(--bg-panel-raised);
    border: 1px solid var(--line-bright);
    border-radius: 10px;
    padding: 0 20px;
    color: var(--text-primary);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.01em;
    text-transform: none;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .btn-verify:hover:not(:disabled) { border-color: var(--red); color: var(--red-glow); }
  .btn-verify:active:not(:disabled) { transform: scale(0.97); }
  .btn-verify:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Status area */
  .big-status {
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 0.01em;
    text-transform: none;
    margin: 18px 0 4px;
    opacity: 0;
    transform: scale(0.9);
    animation: bigStatusIn 0.4s ease forwards;
  }
  .big-status.ok { color: var(--green); text-shadow: 0 0 24px rgba(74, 157, 111, 0.6); }
  .big-status.fail { color: var(--red-glow); text-shadow: 0 0 24px rgba(224, 82, 79, 0.6); }
  @keyframes bigStatusIn { to { opacity: 1; transform: scale(1); } }

  .status-zone {
    margin-top: 20px;
    min-height: 0;
    overflow: hidden;
    transition: min-height 0.35s ease;
  }
  .status-zone.active { min-height: 64px; }

  .status-line {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg-void);
    opacity: 0;
    transform: translateY(-4px);
    animation: statusIn 0.3s ease forwards;
  }
  @keyframes statusIn { to { opacity: 1; transform: translateY(0); } }

  .status-line.scanning { color: var(--text-dim); }
  .status-line.ok { color: var(--green); border-color: rgba(74, 157, 111, 0.35); }
  .status-line.fail { color: var(--red-glow); border-color: rgba(194, 59, 59, 0.35); }

  .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .dot.scanning { background: var(--text-dim); animation: pulse 1s ease-in-out infinite; }
  .dot.ok { background: var(--green); }
  .dot.fail { background: var(--red-glow); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .scan-bar-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
  }
  .scan-percent {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    min-width: 34px;
    text-align: right;
    flex-shrink: 0;
  }
  .scan-bar {
    flex: 1;
    height: 2px;
    background: var(--bg-void);
    border-radius: 8px;
    overflow: hidden;
  }
  .scan-bar-fill {
    height: 100%;
    width: 0%;
    background: var(--red-glow);
    border-radius: 8px;
  }
  /* Le remplissage de la barre est piloté en JS pour rester synchronisé avec le %. */

  /* Result / action zone */
  .action-zone {
    margin-top: 18px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
  }
  .action-zone.open { max-height: 900px; }

  /* Une fois connecté (mode-boutons actif), le contenu peut dépasser 900px
     (Administration > Permission, formulaires longs, etc.) — on ne le limite
     donc plus, sinon il est coupé sans pouvoir défiler. Les 900px ne servent
     qu'à l'animation d'ouverture juste après la connexion. */
  body.mode-boutons .action-zone,
  body.mode-boutons .action-zone.open {
    max-height: none;
    overflow: visible;
  }

  .id-card {
    background: var(--bg-panel-raised);
    border: 1px solid rgba(74, 157, 111, 0.3);
    border-radius: 10px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    opacity: 0;
    transform: translateY(6px);
  }
  .action-zone.open .id-card { animation: statusIn 0.4s ease 0.1s forwards; }

  .id-card-info .id-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
  }
  .id-card-info .id-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .btn-access {
    background: var(--green);
    color: #0a0d12;
    border: none;
    border-radius: 10px;
    padding: 11px 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.01em;
    text-transform: none;
    cursor: pointer;
    flex-shrink: 0;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .btn-access:hover { filter: brightness(1.12); }
  .btn-access:active { transform: scale(0.96); }

  .btn-site-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    background: var(--green);
    color: #0a0d12;
    text-decoration: none;
    border-radius: 10px;
    padding: 14px 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.01em;
    text-transform: none;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .btn-site-link:hover { filter: brightness(1.12); }
  .btn-site-link:active { transform: scale(0.97); }

  .docs-panel {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px dashed var(--line-bright);
  }
  .docs-panel .docs-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.01em;
    text-transform: none;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .doc-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--bg-panel-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    color: var(--text-primary);
    text-decoration: none;
    font-size: 13px;
    transition: border-color 0.15s ease;
  }
  .doc-link:hover { border-color: var(--red); color: var(--red-glow); }
  .doc-link .arrow { color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }

  .menu-boutons {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 60px 40px;
    max-width: 480px;
    margin: 0 auto;
  }
  .btn-lien-mdc {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(20, 40, 74, 0.92);
    border: 1px solid var(--blue);
    border-radius: 12px;
    padding: 22px 24px;
    color: var(--text-primary);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.01em;
    text-transform: none;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
  }
  .btn-lien-icone { font-size: 16px; flex: none; line-height: 1; filter: grayscale(0.15); }
  .btn-lien-mdc:hover { border-color: var(--blue-glow); color: var(--blue-glow); box-shadow: 0 0 0 3px rgba(91, 155, 240, 0.18); }
  .btn-lien-mdc:active { transform: scale(0.98); }

  /* ==== Dashboard : barre du haut ==== */
  body.mode-boutons::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 64px;
    background: linear-gradient(180deg, #0e1726, #0a121e);
    border-bottom: 1px solid var(--line-bright);
    z-index: 8;
    pointer-events: none;
  }
  body.mode-boutons .btn-refresh-corner { top: 15px; left: 296px; }
  body.mode-boutons .badge-corner { top: 12px; z-index: 12; background: rgba(194, 59, 59, 0.16); border-color: rgba(224, 82, 79, 0.5); border-radius: 10px; }
  @media (max-width: 900px) {
    body.mode-boutons .btn-refresh-corner { left: 20px; }
  }

  /* Marque + horloge dans la barre du haut du dashboard */
  .topbar-brand-mdc {
    display: none;
    position: fixed;
    top: 0; left: 0;
    height: 64px;
    width: 280px;
    align-items: center;
    gap: 10px;
    padding-left: 22px;
    z-index: 9;
    pointer-events: none;
  }
  .topbar-brand-croix {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    position: relative;
    perspective: 300px;
    flex-shrink: 0;
  }
  .topbar-brand-croix .coin {
    width: 100%;
    height: 100%;
  }
  .topbar-brand-texte {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--text-primary);
  }
  .topbar-horloge {
    display: none;
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%);
    height: 64px;
    align-items: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.01em;
    color: var(--text-dim);
    z-index: 9;
    pointer-events: none;
  }
  body.mode-boutons .topbar-brand-mdc,
  body.mode-boutons .topbar-horloge { display: flex; }
  @media (max-width: 900px) {
    .topbar-brand-mdc, .topbar-horloge { display: none !important; }
  }

  /* Mode "dashboard" : barre latérale fixe pleine hauteur, contenu à droite. */
  .sidebar-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line-bright);
    margin-bottom: 10px;
    perspective: 400px;
  }
  .sidebar-header img {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    animation: spinY 6s linear infinite;
    filter: drop-shadow(0 0 8px rgba(224, 82, 79, 0.5));
  }
  .sidebar-header span {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.01em;
    text-transform: none;
    color: var(--text-primary);
    line-height: 1.3;
  }
  body.mode-boutons .menu-boutons {
    position: fixed;
    top: 64px;
    left: 0;
    height: calc(100vh - 64px);
    width: 280px;
    background: linear-gradient(180deg, #0d1626, #0a1220);
    border-right: 1px solid var(--line-bright);
    padding: 0 16px 16px;
    margin: 0;
    max-width: none;
    gap: 10px;
    overflow-y: auto;
    z-index: 20;
  }
  body.mode-boutons .btn-lien-mdc {
    background: rgba(20, 40, 74, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 12px;
    padding: 14px 16px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0;
    text-transform: none;
    text-align: left;
  }
  body.mode-boutons .btn-lien-mdc.actif {
    background: rgba(58, 123, 213, 0.16);
    border-color: rgba(91, 155, 240, 0.55);
    color: var(--blue-glow);
    box-shadow: inset 0 0 0 1px rgba(91, 155, 240, 0.2);
  }
  body.mode-boutons .btn-lien-admin {
    border-color: rgba(224, 82, 79, 0.55);
    background: rgba(194, 59, 59, 0.16);
    color: #ffb4b0;
  }
  body.mode-boutons .btn-lien-admin:hover { border-color: var(--red-glow); color: var(--red-glow); box-shadow: 0 0 0 3px rgba(224, 82, 79, 0.18); }
  .btn-admin-corner {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 20;
    padding: 14px 22px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
  }
  /* Dossiers de boutons (menu de gauche) : quand un dossier est ouvert, le
     bouton "Administration" en bas à gauche disparaît, et le bouton
     "← Retour" (généré dans la liste elle-même) prend sa place visuelle. */
  body.dossier-ouvert .btn-admin-corner { display: none; }
  .btn-lien-retour-dossier {
    border-color: rgba(224, 82, 79, 0.55);
    background: rgba(194, 59, 59, 0.16);
    color: #ffb4b0;
    margin-bottom: 6px;
  }
  body.mode-boutons #contenuLienMDC { margin-left: 300px; width: calc(100% - 300px - 24px); margin-top: 88px; margin-right: 24px; }
  body.mode-boutons .footer-note,
  body.mode-boutons .panel-strip { display: none; }
  body.mode-boutons .panel { background: transparent; }
  body.mode-boutons .docs-panel { position: fixed; left: 16px; bottom: 16px; width: 248px; z-index: 20; border-top: none; margin: 0; }

  @media (max-width: 900px) {
body.mode-boutons .menu-boutons {
  position: static;
  top: auto;
  left: auto;
  transform: none;
  width: 100%;
  height: auto;
  max-width: 100%;
  flex-direction: row;
  flex-wrap: wrap;
  gap: 8px;
  z-index: auto;
  margin: 150px 0 16px 0;
  border-right: none;
}
    body.mode-boutons .sidebar-header { width: 100%; }
    body.mode-boutons .btn-lien-mdc {
      flex: 1 1 calc(50% - 4px);
      padding: 14px 10px;
      font-size: 11.5px;
      text-align: center;
      justify-content: center;
    }
    body.mode-boutons #contenuLienMDC {
      margin-left: 0;
      margin-right: 0;
      width: 100%;
    }
    .admin-topbar-fixe {
      position: static;
      transform: none;
      width: 100%;
      flex-wrap: wrap;
      margin: 0 0 14px 0;
    }
    body.mode-admin .console { margin-top: 0; }
    .console.expanded { max-width: 100%; }
  }

  /* Le logo animé ne descend en bas à droite qu'une fois qu'un lien a été ouvert. */
body.lien-ouvert .header {
    position: fixed;
    bottom: 24px;
    left: 24px;
    margin: 0;
    z-index: 5;
    pointer-events: none;
}
  body.lien-ouvert .crest {
    width: 90px;
    height: 90px;
    margin-bottom: 8px;
  }
  body.lien-ouvert .header-text .eyebrow { font-size: 9px; }
  body.lien-ouvert .header-text h1 { font-size: 14px; }

  .iframe-wrap {
    width: 100%;
    height: 88vh;
    border-radius: 10px;
    overflow: hidden;

  .rapport-field input, .rapport-field textarea { width: 100%; border: 1px solid rgba(111, 181, 211, 0.35); border-radius: 8px; background: rgba(1, 13, 23, 0.72); padding: 11px 12px; color: #edf8ff; font: 13px 'Plus Jakarta Sans', sans-serif; outline: none; transition: border-color .16s ease, box-shadow .16s ease; }

  .rapport-submit { width: 100%; margin-top: 16px; border: 1px solid #45b5e4; border-radius: 8px; padding: 12px 15px; background: linear-gradient(135deg, #1982ba, #13518e); color: #fff; font: 800 12px 'IBM Plex Mono', monospace; letter-spacing: 0.01em; text-transform: none; cursor: pointer; box-shadow: 0 8px 18px rgba(17, 111, 169, .28); transition: transform .16s ease, filter .16s ease; }

  .rapport-feedback.ok { color: #76e3b2; }.rapport-feedback.fail { color: #ff9d99; }

  .rapport-history-item::before { content: ''; position: absolute; left: 0; top: 20px; width: 7px; height: 7px; border-radius: 50%; background: #5bc4ee; box-shadow: 0 0 10px #5bc4ee; }
  .rapport-history-top { display: flex; justify-content: space-between; gap: 8px; color: #a4c9dd; font: 10px 'IBM Plex Mono', monospace; }
  .rapport-history-values { display: flex; gap: 7px; margin-top: 8px; }

  .rapport-history-sync { margin-top: 7px; color: #ffac9f; font: 700 9px 'IBM Plex Mono', monospace; letter-spacing: 0.01em; text-transform: none; }
  .rapport-validation { margin-top: 18px; border: 1px solid rgba(237, 183, 77, .34); border-radius: 11px; background: rgba(83, 57, 11, .13); overflow: hidden; }
  .rapport-validation-head { padding: 12px 14px; border-bottom: 1px solid rgba(237, 183, 77, .22); color: #ffe6a1; font: 800 10px 'IBM Plex Mono', monospace; letter-spacing: 0.01em; text-transform: none; }

  .rapport-validation-btn:hover { background: rgba(49, 160, 113, .36); }
  @media (max-width: 850px) { .rapport-mdc-grid { grid-template-columns: 1fr; }.rapport-mdc-wrap { padding: 15px; }.rapport-mdc-header { align-items: flex-start; flex-direction: column; }.rapport-mdc-stats { width: 100%; }.rapport-stat { flex: 1; } }

    border: 1px solid rgba(224, 176, 79, 0.4);
    color: #f0d9a0;
  }
  .medaille-pill.medaille-vide {
    background: rgba(255,255,255,0.05);
    border-color: #2c4a78;
    color: #6f8bb8;
  }

  /* === Effectif médical : fiches horizontales compactes === */
  .effectif-table thead { display: none; }
  .effectif-table tbody { display: block; }
  .effectif-table tbody tr {
    display: grid;
    grid-template-columns: minmax(115px, 1.05fr) minmax(165px, 1.45fr) minmax(145px, 1.2fr) minmax(100px, .8fr) minmax(150px, 1.15fr) minmax(105px, auto);
    align-items: center;
    min-height: 68px;
    padding: 0 16px;
    border-bottom: 1px solid rgba(91, 155, 240, 0.16);
    background: rgba(7, 18, 34, 0.54);
    transition: background 0.16s ease, box-shadow 0.16s ease;
  }
  .effectif-table tbody tr:nth-child(even) { background: rgba(16, 35, 61, 0.68); }
  .effectif-table tbody tr:hover { background: rgba(34, 72, 117, 0.52); box-shadow: inset 3px 0 0 #5b9bf0; }
  .effectif-table.effectif-table-lecture tbody tr {
    grid-template-columns: minmax(115px, 1.05fr) minmax(165px, 1.45fr) minmax(145px, 1.2fr) minmax(100px, .8fr) minmax(150px, 1.15fr);
  }
  .effectif-table tbody td {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 5px;
    min-width: 0;
    padding: 10px 8px !important;
    border: 0 !important;
    background: transparent !important;
    white-space: nowrap;
  }
  .effectif-table tbody td::before {
    content: attr(data-label);
    color: #7495bf;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.01em;
    text-transform: none;
  }
  .effectif-table tbody .cell-action { align-items: flex-end; }
  @media (max-width: 900px) {
    .effectif-table tbody tr { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 7px 12px; }
    .effectif-table tbody .cell-action { align-items: flex-start; }
  }
  @media (max-width: 520px) {
    .effectif-table tbody tr { grid-template-columns: 1fr; }
  }

  /* === Édition directe de l'effectif (double vérification) === */
  .effectif-note {
    padding: 10px 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.02em;
    color: #8fe0af;
    background: rgba(74, 157, 111, 0.1);
    border-bottom: 1px solid #2c4a78;
  }
  .effectif-edit-input {
    width: 100%;
    min-width: 90px;
    background: var(--bg-void);
    border: 1px solid var(--line-bright);
    border-radius: 10px;
    padding: 7px 9px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 12.5px;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.15s ease;
  }
  .effectif-edit-input:focus { border-color: var(--blue-glow); }
  .effectif-edit-input-num { text-align: center; }
  select.effectif-edit-input { cursor: pointer; }
  td.cell-action { white-space: nowrap; }
  .cell-action-double { display: flex; gap: 6px; }
  .btn-effectif-modifier {
    background: rgba(91, 155, 240, 0.16);
    color: #bcd8ff;
    border: 1px solid var(--blue-glow);
    border-radius: 10px;
    padding: 8px 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.01em;
    text-transform: none;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-effectif-modifier:hover { background: rgba(91, 155, 240, 0.28); }
  .btn-effectif-annuler {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--line-bright);
    border-radius: 10px;
    padding: 8px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.01em;
    text-transform: none;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-effectif-annuler:hover { border-color: var(--red-glow); color: var(--red-glow); }
  .btn-effectif-save {
    background: var(--green);
    color: #0a0d12;
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.01em;
    text-transform: none;
    cursor: pointer;
    white-space: nowrap;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .btn-effectif-save:hover:not(:disabled) { filter: brightness(1.12); }
  .btn-effectif-save:disabled { opacity: 0.6; cursor: default; }

  /* === Bouton Administration (visible uniquement pour la double vérification) === */
  .btn-lien-admin {
    border-color: var(--red);
    background: rgba(74, 20, 20, 0.92);
  }
  .btn-lien-admin:hover { border-color: var(--red-glow); color: var(--red-glow); box-shadow: 0 0 0 3px rgba(224, 82, 79, 0.18); }

  /* === Panneau Administration === */
  .admin-wrap {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    border-radius: var(--radius-card);
    border: 1px solid #2c4a78;
    background: linear-gradient(180deg, #101d33, #0b1526);
    box-shadow: var(--shadow-panel);
    transition: max-width 0.3s ease;
  }
  .admin-wrap.admin-wrap-large {
    max-width: 1400px;
  }
  .admin-wrap-large .iframe-wrap {
    height: 76vh;
  }
  .admin-header {
    padding: 18px 22px;
    border-bottom: 1px solid #2c4a78;
    background: #16294a;
    border-radius: var(--radius-card) var(--radius-card) 0 0;
  }
  .admin-header h2 {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.01em;
    text-transform: none;
    color: var(--text-primary);
  }
  .admin-header h2::before {
    content: '📋';
    font-size: 15px;
  }
  /* Icône propre à chaque section, déduite de l'onglet Administration actif */
  body:has(#ongletAdminLogs.actif) .admin-header h2::before { content: '🕘'; }
  body:has(#ongletAdminGrades.actif) .admin-header h2::before { content: '🎖️'; }
  body:has(#ongletAdminBoutons.actif) .admin-header h2::before { content: '🧭'; }
  body:has(#ongletAdminTextes.actif) .admin-header h2::before { content: '🗒️'; }
  body:has(#ongletAdminMateriel.actif) .admin-header h2::before { content: '🩺'; }
  body:has(#ongletAdminPermission.actif) .admin-header h2::before { content: '🔐'; }
  .admin-body { padding: 22px 24px 26px; }
  .admin-body .field-label { display: block; margin-bottom: 10px; }
  .admin-message {
    margin-top: 12px;
    min-height: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.02em;
  }
  .admin-message.ok { color: var(--green); }
  .admin-message.fail { color: var(--red-glow); }
  .admin-liste-titre {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin: 26px 0 14px;
    padding: 8px 13px 8px 10px;
    border: 1px solid rgba(85, 238, 189, 0.22);
    border-radius: 999px;
    background: rgba(8, 21, 32, 0.7);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.01em;
    text-transform: none;
    color: #b8f5df;
  }
  .admin-liste-titre::before {
    content: '●';
    font-size: 11px;
    color: #59e1ab;
    text-shadow: 0 0 11px #59e1ab;
  }
  .admin-liste {
    position: relative;
    list-style: none;
    padding: 5px 0 5px 28px;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
    max-height: 390px;
    overflow-y: auto;
    background:
      linear-gradient(90deg, transparent 0 15px, rgba(102, 219, 173, 0.32) 15px 16px, transparent 16px),
      linear-gradient(180deg, rgba(8, 17, 28, 0.78), rgba(10, 20, 32, 0.36));
    border: 1px solid rgba(95, 167, 198, 0.24);
    border-radius: 14px;
    scrollbar-color: #4bbf99 #0b1621;
    scrollbar-width: thin;
  }
  .admin-liste li {
    background: var(--bg-panel-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 13px;
    color: var(--text-primary);
  }
  .admin-liste li.admin-liste-vide { color: var(--text-dim); font-style: italic; }
  .admin-liste li.log-entry {
    position: relative;
    overflow: visible;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    cursor: pointer;
    transition: background 0.18s ease;
  }
  .admin-liste li.log-entry::before {
    content: '';
    position: absolute;
    z-index: 1;
    top: 23px;
    left: -19px;
    width: 10px;
    height: 10px;
    border: 3px solid #102332;
    border-radius: 50%;
    background: #63ddaf;
    box-shadow: 0 0 0 2px rgba(98, 222, 175, 0.24), 0 0 12px rgba(98, 222, 175, 0.65);
  }
  .admin-liste li.log-entry:hover,
  .admin-liste li.log-entry.log-ouvert {
    background: rgba(102, 222, 175, 0.035);
  }
  .log-entry-main {
    display: flex;
    align-items: center;
    gap: 13px;
    min-height: 66px;
    padding: 12px 13px 12px 2px;
    border-bottom: 1px solid rgba(116, 174, 192, 0.13);
  }
  .log-avatar {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    border: 1px solid rgba(100, 228, 180, 0.52);
    border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #336c65, #163641 72%);
    color: #caffeb;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 800;
    box-shadow: 0 0 0 4px rgba(85, 220, 169, 0.06);
  }
  .log-details { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .log-expand {
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(126, 180, 194, 0.25);
    border-radius: 50%;
    color: #8fb6bf;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    line-height: 1;
    transition: transform 0.18s ease, color 0.18s ease, background 0.18s ease;
  }
  .log-entry.log-ouvert .log-expand { transform: rotate(180deg); color: #caffeb; background: rgba(77, 208, 162, 0.14); }
  .log-entry .log-delete-btn {
    display: none;
    width: auto;
    margin: 0 13px 13px 53px;
    background: transparent;
    border: 1px dashed rgba(255, 131, 125, 0.66);
    border-radius: 999px;
    padding: 7px 13px;
    color: #ffaba6;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.01em;
    text-transform: none;
    cursor: pointer;
  }
  .log-entry .log-delete-btn:hover { background: rgba(194, 59, 59, 0.2); border-style: solid; border-color: var(--red-glow); color: #fff; }
  .log-entry.log-ouvert .log-delete-btn { display: block; }
  /* FIX : Boutons du menu / Grades réutilisent .log-entry pour le style mais
     n'ont pas de mécanisme "déplier" (pas de classe .log-ouvert) -> leur
     bouton Supprimer restait invisible en permanence. On le rend visible en
     permanence pour ces deux listes précises, sans toucher au Journal. */
  #adminBoutonsListe .log-delete-btn,
  #adminGradesListe .log-delete-btn {
    display: inline-block;
    margin: 10px 13px 13px 0;
  }
  .log-entry .log-texte { color: #d8e9ea; line-height: 1.4; font-size: 12.5px; }
  .log-entry .log-texte strong { color: #fff; font-size: 14px; }
  .log-entry .log-non-sync {
    display: inline-block;
    margin-left: 4px;
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.005em;
    text-transform: none;
    background: rgba(194, 59, 59, 0.18);
    border: 1px solid rgba(224, 82, 79, 0.5);
    color: #ff8f8c;
    white-space: nowrap;
  }
  .log-entry .log-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.01em;
    text-transform: none;
    color: #78a7ad;
  }
  .log-action-badge {
    display: inline-block;
    padding: 3px 7px;
    border: 0;
    border-radius: 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.01em;
    text-transform: none;
    margin-right: 5px;
    vertical-align: 1px;
  }
  .log-action-promotion { background: #1c553e; color: #9bffd0; }
  .log-action-retrogradation { background: #682b32; color: #ffbab5; }
  .log-action-sanction { background: #284e73; color: #c6e5ff; }
  .log-action-depart { background: #3b4650; color: #e1e9e9; }
  .log-action-medaille { background: #705d27; color: #fff0ad; }
  .log-action-defaut { background: #3b4650; color: #e1e9e9; }
  @media (max-width: 520px) {
    .admin-liste { padding-left: 24px; }
    .admin-liste li.log-entry::before { left: -17px; }
    .log-entry-main { gap: 9px; padding-right: 8px; }
    .log-avatar { width: 33px; height: 33px; font-size: 12px; }
    .log-entry .log-meta { font-size: 9px; letter-spacing: 0.005em; }
    .log-entry .log-delete-btn { margin-left: 42px; }
  }

  /* === Formulaire d'ajout manuel d'un log (Promo / Rétro / Sanction / Départ / Médaille) === */
  .log-add-form {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    align-items: center;
    background: linear-gradient(135deg, rgba(14, 38, 47, 0.96), rgba(14, 25, 39, 0.94));
    border: 1px solid rgba(99, 215, 177, 0.28);
    border-radius: 14px;
    padding: 13px;
    margin-bottom: 17px;
    box-shadow: inset 0 1px 0 rgba(209, 255, 240, 0.06), 0 10px 24px rgba(0, 0, 0, 0.16);
  }
  .log-add-form select,
  .log-add-form input {
    background: rgba(5, 17, 27, 0.72);
    border: 1px solid rgba(128, 184, 192, 0.38);
    border-radius: 8px;
    padding: 9px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-primary);
    outline: none;
  }
  .log-add-form select:focus,
  .log-add-form input:focus { border-color: #69e4b7; box-shadow: 0 0 0 3px rgba(105, 228, 183, 0.12); }
  .log-add-form input[type="text"] { flex: 1 1 160px; min-width: 140px; }
  .log-add-form .btn-cell-action {
    margin-right: 0;
    border-radius: 8px;
    background: linear-gradient(135deg, #49bc8f, #2d8c86);
    box-shadow: 0 5px 12px rgba(33, 140, 111, 0.25);
  }
  .log-add-msg {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.005em;
    margin-bottom: 10px;
  }
  .log-add-msg.ok { color: #8fe0af; }
  .log-add-msg.fail { color: #ff9c99; }

  /* FIX (demande utilisateur) : la barre d'onglets Administration devient un
     menu latéral (comme le menu principal à gauche) au lieu d'une barre
     horizontale en haut. Le menu principal (.menu-boutons) et le bouton
     "Administration" (.btn-admin-corner) sont masqués pendant le mode-admin
     ; "← Retour" (dernier bouton de la barre) les fait réapparaître. */
  .admin-topbar-fixe {
    display: none;
  }
  body.mode-admin .admin-topbar-fixe {
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 64px;
    left: 0;
    width: 280px;
    height: calc(100vh - 64px);
    justify-content: flex-start;
    align-items: stretch;
    z-index: 20;
    gap: 10px;
    background: linear-gradient(180deg, #0d1626, #0a1220);
    border: none;
    border-right: 1px solid var(--line-bright);
    border-radius: 0;
    padding: 16px;
    backdrop-filter: none;
    box-shadow: none;
    overflow-y: auto;
  }
  body.mode-admin .menu-boutons,
  body.mode-admin .btn-admin-corner {
    display: none;
  }
  body.mode-admin #contenuLienMDC { margin-top: 88px; }
  body.mode-admin .btn-admin-retour {
    margin-top: auto;
    border-color: rgba(224, 82, 79, 0.55);
    background: rgba(194, 59, 59, 0.16);
    color: #ffb4b0;
  }
  .btn-admin-tab {
    background: rgba(20, 40, 74, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0;
    text-transform: none;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: normal;
    width: 100%;
  }
  .btn-admin-tab:hover { border-color: var(--blue-glow); color: var(--blue-glow); }
  .btn-admin-tab.actif {
    background: var(--blue);
    border-color: var(--blue-glow);
    color: #fff;
  }
  .admin-contenu { padding: 22px 24px 26px; }
  .admin-placeholder {
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.03em;
  }
  .admin-contenu .iframe-wrap { margin: -22px -24px -26px; }

  /* === Fenêtre centrale (modale) pour l'Effectif MDC GDA (Google Sheet) === */
  .effectif-modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(6, 9, 15, 0.72);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .effectif-modal-box {
    width: min(1300px, 92vw);
    height: min(820px, 86vh);
    background: linear-gradient(180deg, #101d33, #0b1526);
    border: 1px solid #2c4a78;
    border-radius: 6px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .effectif-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid #2c4a78;

  }
  .effectif-modal-header h2 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.01em;
    text-transform: none;
    color: var(--text-primary);
  }
  .effectif-modal-close {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--line-bright);
    border-radius: 10px;
    color: var(--text-primary);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.01em;
    text-transform: none;
    padding: 7px 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .effectif-modal-close:hover { border-color: var(--red-glow); color: var(--red-glow); }
  .effectif-modal-box .iframe-wrap { flex: 1; margin: 0; height: auto; }

  .footer-note {
    margin-top: 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-faint);
    text-align: center;
    letter-spacing: 0.005em;
  }
  .badge-corner {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10;
    background: rgba(18, 22, 29, 0.92);
    border: 1px solid var(--line-bright);
    border-radius: 12px;
    padding: 12px 16px;
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 18px rgba(0,0,0,0.4);
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
  }
  .btn-refresh-corner {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 7px;
    background: rgba(18, 22, 29, 0.92);
    border: 1px solid var(--line-bright);
    border-radius: 12px;
    padding: 10px 14px;
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 18px rgba(0,0,0,0.4);
    color: var(--text-primary);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
    text-transform: none;
    cursor: pointer;
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity 0.3s ease, transform 0.3s ease, border-color 0.15s ease, color 0.15s ease;
    pointer-events: none;
  }
  .btn-refresh-corner.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .btn-refresh-corner:hover { border-color: var(--blue-glow); color: var(--blue-glow); }
  .btn-refresh-corner:active { transform: scale(0.96); }
  .btn-refresh-corner svg { width: 13px; height: 13px; flex: none; transition: transform 0.4s ease; }
  .btn-refresh-corner.tourne svg { transform: rotate(360deg); }
  .badge-corner.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .badge-line {
    display: flex;
    align-items: center;
